[package]
name = "suu"
version = "0.1.0"
description = "SUU — Kişisel Hidrasyon ve Su Alışkanlığı Uygulaması"
authors = ["c4kar"]
edition = "2021"

[lib]
name = "suu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-suu-notifications = { path = "tauri-plugin-suu-notifications" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
